<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="1130" fill="white"/>
<text x="500" y="50" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="30">故障排查：先保留证据，再逐层定位</text>
<rect x="65" y="105" width="870" height="100" rx="12" fill="#fff3db" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="142" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">1 记录现场</text>
<text x="500.0" y="177" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">时间 / 操作 / 日志 / 配置 / 故障通道</text>
<path d="M500,205 L500,242" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="255" width="870" height="100" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="292" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">2 确认运行身份</text>
<text x="500.0" y="327" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">PID / ELF 哈希 / 提交 / 启动者 / 外部服务版本</text>
<path d="M500,355 L500,392" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="405" width="870" height="100" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="442" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">3 检查系统依赖</text>
<text x="500.0" y="477" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">显示 / 驱动 / 存储 / 插件 / 权限 / 资源</text>
<path d="M500,505 L500,542" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="555" width="870" height="100" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="592" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">4 核对上游数据</text>
<text x="500.0" y="627" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">帧或消息是否有效、持续更新、协议匹配</text>
<path d="M500,655 L500,692" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="705" width="870" height="100" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="742" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">5 追本程序内部</text>
<text x="500.0" y="777" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">接收 → 解析 → 属性 / 信号 → QML 规则 → 绘制</text>
<path d="M500,805 L500,842" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="855" width="870" height="100" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="892" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">6 复现、修复、回归</text>
<text x="500.0" y="927" text-anchor="middle" fill="#172033" font-family="Noto Sans CJK SC" font-size="24">明确断点与根因；保留修复前后的对照材料</text>
<text x="50" y="1050" text-anchor="start" fill="#172033" font-family="Noto Sans CJK SC" font-size="23">上游异常：查生产者 / 系统；上游有效但内部失效：追本程序。</text>
<text x="50" y="1090" text-anchor="start" fill="#172033" font-family="Noto Sans CJK SC" font-size="23">重启后恢复只能证明现象变化，不能单独证明根因。</text>
</svg>